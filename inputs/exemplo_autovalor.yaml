titulo: "Autovalor 1D — dois núcleos fracamente acoplados (Wielandt)"
dimensao: 1
modo: autovalor

malha:
  Lx: 60.0
  Nx: 1200

bc:
  esquerda: vacuo
  direita: vacuo

regioes:
  - nome: espalhador
    x: [0.0, 60.0]
    sigma_t: 1.0
    sigma_s: 0.95
  - nome: nucleo1
    x: [5.0, 25.0]
    sigma_t: 1.0
    sigma_s: 0.70
    nu_sigma_f: 0.39
  - nome: nucleo2
    x: [35.0, 55.0]
    sigma_t: 1.0
    sigma_s: 0.70
    nu_sigma_f: 0.39

solver:
  metodo: direto
  autovalor:
    metodo: wielandt
    tol_k: 1.0e-8
    tol_phi: 1.0e-6

saida:
  prefixo: outputs/autovalor_wielandt
